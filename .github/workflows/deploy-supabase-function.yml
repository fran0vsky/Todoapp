name: Deploy Supabase Function

on:
  workflow_call:
    outputs:
      deployment_url:
        description: Backend function URL
        value: ${{ jobs.deploy.outputs.deployment_url }}
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deployment_url.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy todo-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p reports/deploy/backend
          set -o pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "Set repository secret SUPABASE_ACCESS_TOKEN (Supabase CLI login token)."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "Set repository variable SUPABASE_PROJECT_REF."
            exit 1
          fi
          supabase functions deploy todo-api --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt | tee reports/deploy/backend/deploy.log

      - name: Resolve deployment URL
        id: deployment_url
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: echo "value=https://${SUPABASE_PROJECT_REF}.functions.supabase.co/todo-api" >> "$GITHUB_OUTPUT"

      - name: Upload backend deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-backend-artifacts
          path: reports/deploy/backend
          if-no-files-found: warn

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Backend deploy"
            echo "- Endpoint: ${{ steps.deployment_url.outputs.value }}"
            echo "- Artifacts: deploy-backend-artifacts"
            echo "- Run artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
