name: Deploy Supabase Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-function.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy todo-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "Set repository secret SUPABASE_ACCESS_TOKEN (Supabase CLI login token)."
            exit 1
          fi
          supabase functions deploy todo-api --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --no-verify-jwt
