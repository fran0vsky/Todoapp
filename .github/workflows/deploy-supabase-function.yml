name: Deploy Supabase Function

on:
  workflow_call:
    outputs:
      deployment_url:
        description: Backend function URL
        value: ${{ jobs.deploy.outputs.deployment_url }}
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      deployment_url: ${{ steps.deployment_url.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy todo-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p reports/deploy/backend
          exec > >(tee -a reports/deploy/backend/deploy.log) 2>&1
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "Set repository secret SUPABASE_ACCESS_TOKEN (Supabase CLI login token)."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "Set repository variable SUPABASE_PROJECT_REF."
            exit 1
          fi
          set -o pipefail
          supabase functions deploy todo-api --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt

      - name: Resolve deployment URL
        id: deployment_url
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: echo "value=https://${SUPABASE_PROJECT_REF}.functions.supabase.co/todo-api" >> "$GITHUB_OUTPUT"

      - name: Upload backend deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-backend-artifacts
          path: reports/deploy/backend
          if-no-files-found: warn

      - name: Resolve backend deploy artifact link
        id: backend_artifact_link
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'deploy-backend-artifacts';
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const artifact = data.artifacts.find((item) => item.name === artifactName && !item.expired);
            if (!artifact) {
              core.warning(`Artifact ${artifactName} not found`);
              core.setOutput('url', '');
              return;
            }
            const url = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
            core.setOutput('url', url);

      - name: Deployment summary
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deployment_url.outputs.value }}
          BACKEND_ARTIFACT_URL: ${{ steps.backend_artifact_link.outputs.url }}
        run: |
          {
            echo "## Backend deploy"
            if [ -n "$DEPLOYMENT_URL" ]; then
              echo "- Status: success"
              echo "- Endpoint: $DEPLOYMENT_URL"
            else
              echo "- Status: failure"
              echo "- Deployment did not complete. See deploy logs in the deploy-backend-artifacts artifact."
            fi
            echo "- Artifact name: deploy-backend-artifacts"
            if [ -n "$BACKEND_ARTIFACT_URL" ]; then
              echo "- Artifact link: $BACKEND_ARTIFACT_URL"
            fi
            echo "- Report entrypoints:"
            echo "  - reports/deploy/backend/deploy.log"
            echo "- Run artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
