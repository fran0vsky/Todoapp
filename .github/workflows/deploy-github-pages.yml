name: Deploy GitHub Pages

on:
  workflow_call:
    outputs:
      deployment_url:
        description: Frontend deployment URL
        value: ${{ jobs.deploy.outputs.deployment_url }}
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deployment_url.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Substitute Supabase project ref for production API URL
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p reports/deploy/frontend
          exec > >(tee -a reports/deploy/frontend/deploy.log) 2>&1
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Configure repository variable SUPABASE_PROJECT_REF (your Supabase project reference ID)."
            exit 1
          fi
          sed -i "s/PLACEHOLDER_PROJECT_REF/${SUPABASE_PROJECT_REF}/g" todo/src/environments/environment.production.ts

      # Base href matches project Pages URL: https://<owner>.github.io/<repo>/
      - name: Build Angular (production)
        run: |
          mkdir -p reports/deploy/frontend
          exec > >(tee -a reports/deploy/frontend/build.log) 2>&1
          set -o pipefail
          npx nx run todo:build --configuration=production -- --base-href=/Todoapp/

      - name: SPA fallback for GitHub Pages
        run: cp dist/todo/index.html dist/todo/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/todo
          force_orphan: true

      - name: Resolve deployment URL
        id: deployment_url
        run: echo "value=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"

      - name: Upload frontend deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-frontend-artifacts
          path: |
            reports/deploy/frontend
            dist/todo
          if-no-files-found: warn

      - name: Resolve frontend deploy artifact link
        id: frontend_artifact_link
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'deploy-frontend-artifacts';
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const artifact = data.artifacts.find((item) => item.name === artifactName && !item.expired);
            if (!artifact) {
              core.warning(`Artifact ${artifactName} not found`);
              core.setOutput('url', '');
              return;
            }
            const url = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
            core.setOutput('url', url);

      - name: Deployment summary
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deployment_url.outputs.value }}
          FRONTEND_ARTIFACT_URL: ${{ steps.frontend_artifact_link.outputs.url }}
        run: |
          {
            echo "## Frontend deploy"
            if [ -n "$DEPLOYMENT_URL" ]; then
              echo "- Status: success"
              echo "- URL: $DEPLOYMENT_URL"
            else
              echo "- Status: failure"
              echo "- Deployment did not complete. See build logs in the deploy-frontend-artifacts artifact."
            fi
            echo "- Artifact name: deploy-frontend-artifacts"
            if [ -n "$FRONTEND_ARTIFACT_URL" ]; then
              echo "- Artifact link: $FRONTEND_ARTIFACT_URL"
            fi
            echo "- Report entrypoints:"
            echo "  - reports/deploy/frontend/deploy.log"
            echo "  - reports/deploy/frontend/build.log"
            echo "  - dist/todo/index.html"
            echo "- Run artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
