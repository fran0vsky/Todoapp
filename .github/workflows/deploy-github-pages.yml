name: Deploy GitHub Pages

on:
  workflow_call:
    outputs:
      deployment_url:
        description: Frontend deployment URL
        value: ${{ jobs.deploy.outputs.deployment_url }}
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deployment_url.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Substitute Supabase project ref for production API URL
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p reports/deploy/frontend
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Configure repository variable SUPABASE_PROJECT_REF (your Supabase project reference ID)."
            exit 1
          fi
          sed -i "s/PLACEHOLDER_PROJECT_REF/${SUPABASE_PROJECT_REF}/g" todo/src/environments/environment.production.ts

      # Base href matches project Pages URL: https://<owner>.github.io/<repo>/
      - name: Build Angular (production)
        run: |
          mkdir -p reports/deploy/frontend
          set -o pipefail
          npx nx run todo:build --configuration=production -- --base-href=/Todoapp/ | tee reports/deploy/frontend/build.log

      - name: SPA fallback for GitHub Pages
        run: cp dist/todo/index.html dist/todo/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/todo
          force_orphan: true

      - name: Resolve deployment URL
        id: deployment_url
        run: echo "value=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"

      - name: Upload frontend deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-frontend-artifacts
          path: |
            reports/deploy/frontend
            dist/todo
          if-no-files-found: warn

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Frontend deploy"
            echo "- URL: ${{ steps.deployment_url.outputs.value }}"
            echo "- Artifacts: deploy-frontend-artifacts"
            echo "- Run artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
