name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint + format checks
        run: |
          mkdir -p reports/lint
          set +e
          npm run lint > reports/lint/nx-lint.log 2>&1
          LINT_EXIT=$?
          npm run format:check > reports/lint/prettier.log 2>&1
          FORMAT_EXIT=$?
          set -e
          if [ $LINT_EXIT -ne 0 ] || [ $FORMAT_EXIT -ne 0 ]; then
            echo "Lint or format checks failed."
            exit 1
          fi

      - name: Generate SARIF lint reports (per-project)
        if: always()
        run: |
          mkdir -p reports/lint/sarif
          run_eslint() {
            set +e
            "$@"
            local rc=$?
            set -e
            if [ $rc -gt 1 ]; then echo "ESLint tool error (exit $rc)"; exit $rc; fi
          }
          run_eslint npx eslint "api/**/*.ts" \
            --format @microsoft/eslint-formatter-sarif \
            --output-file reports/lint/sarif/api.sarif
          cd todo && run_eslint npx eslint "**/*.{ts,html}" \
            --format @microsoft/eslint-formatter-sarif \
            --output-file ../reports/lint/sarif/todo.sarif && cd ..
          cd todo-e2e && run_eslint npx eslint "src/**/*.ts" \
            --format @microsoft/eslint-formatter-sarif \
            --output-file ../reports/lint/sarif/e2e.sarif && cd ..

      - name: Generate HTML lint reports (per-project)
        if: always()
        run: |
          mkdir -p reports/lint
          npx eslint "api/**/*.ts" --format html --output-file reports/lint/api.html || true
          cd todo && npx eslint "**/*.{ts,html}" --format html --output-file ../reports/lint/todo.html || true && cd ..
          cd todo-e2e && npx eslint "src/**/*.ts" --format html --output-file ../reports/lint/e2e.html || true && cd ..

      - name: Upload API SARIF to code scanning
        if: ${{ always() && hashFiles('reports/lint/sarif/api.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/lint/sarif/api.sarif
          category: eslint-api

      - name: Upload Todo SARIF to code scanning
        if: ${{ always() && hashFiles('reports/lint/sarif/todo.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/lint/sarif/todo.sarif
          category: eslint-todo

      - name: Upload E2E SARIF to code scanning
        if: ${{ always() && hashFiles('reports/lint/sarif/e2e.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/lint/sarif/e2e.sarif
          category: eslint-e2e

      - name: Upload lint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: reports/lint
          if-no-files-found: warn

      - name: Resolve lint artifact link
        id: lint_artifact_link
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'lint-reports';
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const artifact = data.artifacts.find((item) => item.name === artifactName && !item.expired);
            if (!artifact) {
              core.warning(`Artifact ${artifactName} not found`);
              core.setOutput('url', '');
              return;
            }
            const url = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
            core.setOutput('url', url);

      - name: Job summary
        if: always()
        env:
          LINT_ARTIFACT_URL: ${{ steps.lint_artifact_link.outputs.url }}
        run: |
          {
            echo "## Lint stage"
            echo "- Artifacts: lint-reports"
            if [ -n "$LINT_ARTIFACT_URL" ]; then
              echo "- Artifact link: $LINT_ARTIFACT_URL"
            fi
            echo "- Report entrypoints:"
            echo "  - reports/lint/api.html"
            echo "  - reports/lint/todo.html"
            echo "  - reports/lint/e2e.html"
            echo "  - reports/lint/sarif/*.sarif"
            echo "- Run artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: |
          mkdir -p reports/test
          set -o pipefail
          npm run test | tee reports/test/test.log

      - name: Build API (verification)
        run: |
          mkdir -p reports/test
          set -o pipefail
          npx nx run api:build | tee reports/test/api-build.log

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-reports
          path: |
            reports/test
            coverage/api
            coverage/todo
          if-no-files-found: warn

      - name: Resolve test artifact link
        id: test_artifact_link
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'test-coverage-reports';
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const artifact = data.artifacts.find((item) => item.name === artifactName && !item.expired);
            if (!artifact) {
              core.warning(`Artifact ${artifactName} not found`);
              core.setOutput('url', '');
              return;
            }
            const url = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
            core.setOutput('url', url);

      - name: Job summary
        if: always()
        env:
          TEST_ARTIFACT_URL: ${{ steps.test_artifact_link.outputs.url }}
        run: |
          {
            echo "## Test stage"
            echo "- Artifacts: test-coverage-reports"
            if [ -n "$TEST_ARTIFACT_URL" ]; then
              echo "- Artifact link: $TEST_ARTIFACT_URL"
            fi
            echo "- Coverage paths: coverage/api, coverage/todo"
            echo "- Report entrypoints:"
            echo "  - coverage/api/index.html"
            echo "  - coverage/todo/index.html"
            echo "  - reports/test/test.log"
            echo "  - reports/test/api-build.log"
            echo "- Run artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_frontend:
    needs: [lint, test]
    uses: ./.github/workflows/deploy-github-pages.yml
    permissions:
      actions: read
      contents: write
    secrets: inherit

  deploy_backend:
    needs: [lint, test]
    uses: ./.github/workflows/deploy-supabase-function.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit

  e2e_post_deploy:
    needs: [deploy_frontend, deploy_backend]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      CI: 'true'
      BASE_URL: ${{ needs.deploy_frontend.outputs.deployment_url }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      API_FUNCTION_URL: ${{ needs.deploy_backend.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser binaries
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run post-deploy E2E suites
        run: |
          mkdir -p reports/e2e
          set -o pipefail
          PUBLIC_EXIT=0
          AUTH_EXIT=0

          VISUAL_EXIT=0

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            npx nx run todo-e2e:e2e -- --project=chromium-public --project=chromium-visual-public | tee reports/e2e/public.log || PUBLIC_EXIT=$?
          else
            echo "Skipped public E2E: Supabase env vars are missing." | tee reports/e2e/public.log
          fi

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ] && [ -n "$SUPABASE_ANON_KEY" ] && [ -n "$E2E_EMAIL" ] && [ -n "$E2E_PASSWORD" ]; then
            npx nx run todo-e2e:e2e -- --project=setup --project=chromium --project=chromium-visual | tee reports/e2e/auth.log || AUTH_EXIT=$?
          else
            echo "Skipped authenticated E2E: E2E credentials are missing." | tee reports/e2e/auth.log
            echo "Skipped visual regression (auth): E2E credentials are missing." | tee reports/e2e/visual.log
          fi

          if [ $PUBLIC_EXIT -ne 0 ] || [ $AUTH_EXIT -ne 0 ] || [ $VISUAL_EXIT -ne 0 ]; then
            echo "One or more E2E suites failed."
            exit 1
          fi

      - name: Collect frontend runtime coverage (HTML)
        if: always()
        run: |
          mkdir -p reports/e2e
          set -o pipefail
          node .github/scripts/collect-frontend-e2e-coverage.mjs \
            > reports/e2e/frontend-coverage.log 2>&1 \
            || {
              echo "Frontend coverage collection failed; see reports/e2e/frontend-coverage.log";
              exit 0;
            }

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-observability-artifacts
          path: |
            reports/e2e
            reports/e2e/coverage-html
            dist/.playwright/todo-e2e
          if-no-files-found: warn

      - name: Resolve E2E artifact link
        id: e2e_artifact_link
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'e2e-observability-artifacts';
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const artifact = data.artifacts.find((item) => item.name === artifactName && !item.expired);
            if (!artifact) {
              core.warning(`Artifact ${artifactName} not found`);
              core.setOutput('url', '');
              return;
            }
            const url = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
            core.setOutput('url', url);

      - name: Job summary
        if: always()
        env:
          E2E_ARTIFACT_URL: ${{ steps.e2e_artifact_link.outputs.url }}
        run: |
          {
            echo "## Post-deploy E2E stage"
            echo "- Frontend URL: $BASE_URL"
            echo "- Backend function URL: $API_FUNCTION_URL"
            echo "- Artifacts: e2e-observability-artifacts"
            if [ -n "$E2E_ARTIFACT_URL" ]; then
              echo "- Artifact link: $E2E_ARTIFACT_URL"
            fi
            echo "- Report entrypoints:"
            echo "  - dist/.playwright/todo-e2e/playwright-report/index.html"
            echo "  - dist/.playwright/todo-e2e/test-output/** (videos/screenshots/traces)"
            echo "  - reports/e2e/public.log"
            echo "  - reports/e2e/auth.log"
            echo "  - reports/e2e/visual.log"
            echo "  - reports/e2e/coverage-html/index.html"
            echo "  - reports/e2e/frontend-coverage.log"
            echo "- Run artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
