<div class="min-h-screen bg-black text-white p-6 md:p-10">
  <div class="max-w-5xl w-full mx-auto">
    <div class="flex items-start justify-between gap-4 mb-6">
      <h1 class="text-3xl font-semibold text-white leading-tight">Simple Worflow Menager</h1>

      <!-- Top Add button (opens modal form) -->
      <button
        type="button"
        (click)="openAddForm()"
        class="rounded-xl bg-purple-500 text-white px-5 py-3 font-medium hover:bg-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-300 shadow-sm hover:shadow-md transition-shadow shrink-0"
      >
        Add
      </button>
    </div>

    @if (showAddForm()) {
      <div class="fixed inset-0 bg-black/60 flex items-center justify-center p-6 z-50">
        <div
          class="relative w-full max-w-2xl rounded-xl bg-neutral-900 border border-neutral-800 p-6 pt-14 shadow-lg shadow-black/40"
        >
          <button
            type="button"
            (click)="closeAddForm()"
            class="absolute top-3 right-3 rounded-lg p-2 text-neutral-400 hover:text-white hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-purple-300/50"
            aria-label="Close"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </button>

          <h2 class="text-neutral-200 font-medium mb-4 pr-10">Add task</h2>

          <app-add-edit-task
            [title]="newTaskText()"
            [description]="newTaskDescription()"
            [status]="newTaskStatus()"
            [showStatus]="true"
            [showLabels]="true"
            [disableDoingStatus]="workInProgressFull()"
            [disableSubmit]="
              !newTaskText().trim() ||
              (newTaskStatus() === TaskStatus.Doing && workInProgressFull())
            "
            submitLabel="Save"
            (titleChange)="newTaskText.set($event)"
            (descriptionChange)="newTaskDescription.set($event)"
            (statusChange)="newTaskStatus.set($event)"
            (submitForm)="addTask()"
            (clear)="resetAddForm()"
          />
          @if (workInProgressFull()) {
            <p class="text-amber-200/80 text-xs mt-3" role="status">
              Work in progress is full (1 task max). Complete or remove it to add
              another.
            </p>
          }
        </div>
      </div>
    }

    <app-board
      [isLoading]="isLoading()"
      [editingId]="editingId()"
      [editTitleText]="editTitleText()"
      [editDescriptionText]="editDescriptionText()"
      [tasksToBeDone]="tasksToBeDone()"
      [workInProgressFull]="workInProgressFull()"
      [tasksWorkingOnIt]="tasksWorkingOnIt()"
      [tasksDone]="tasksDone()"
      (openAddWithStatus)="openAddFormWithStatus($event)"
      (startEdit)="startEdit($event)"
      (removeTask)="removeTask($event)"
      (saveEdit)="saveEdit()"
      (clearEditFields)="clearEditFields()"
      (editTitleTextChange)="editTitleText.set($event)"
      (editDescriptionTextChange)="editDescriptionText.set($event)"
    />
  </div>
</div>
