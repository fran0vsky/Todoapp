<div
  class="fixed inset-0 bg-black/60 flex items-center justify-center p-6 z-50"
>
  <div
    class="relative w-full max-w-2xl rounded-xl bg-neutral-900 border border-neutral-800 p-6 pt-14 shadow-lg shadow-black/40"
  >
    <button
      type="button"
      (click)="taskState.closeFormModal()"
      class="absolute top-3 right-3 rounded-lg p-2 text-neutral-400 hover:text-white hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-purple-300/50"
      aria-label="Close"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          fill-rule="evenodd"
          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </button>

    <h2 class="text-neutral-200 font-medium mb-4 pr-10">
      {{ taskState.formModalTitle() }}
    </h2>

    <app-add-edit-task
      [title]="taskState.formTitle()"
      [description]="taskState.formDescription()"
      [formResetCounter]="taskState.formResetCounter()"
      [status]="taskState.formStatus()"
      [estimate]="taskState.formEstimate()"
      [showStatus]="true"
      [showEstimate]="true"
      [showLabels]="true"
      [disableDoingStatus]="taskState.disableDoingInForm()"
      [disableSubmit]="taskState.formSubmitDisabled()"
      [saveDisabledHint]="taskState.formSaveDisabledHint()"
      submitLabel="Save"
      (titleChange)="taskState.setTitle($event)"
      (descriptionChange)="taskState.setDescription($event)"
      (taskStatusChange)="taskState.setStatus($event)"
      (estimateChange)="taskState.setEstimate($event)"
      (submitForm)="taskState.submitForm()"
      (clear)="taskState.resetFormFields()"
    />
    @if (taskState.workInProgressFull()) {
      <p class="text-amber-200/80 text-xs mt-3" role="status">
        Work in progress is full (1 task max). Complete or remove it to add
        another.
      </p>
    }
  </div>
</div>
