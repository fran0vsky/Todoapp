<nav
  class="flex flex-wrap items-center justify-between gap-2 min-h-0"
  aria-label="Main"
>
  <a
    routerLink="/"
    class="text-sm md:text-base font-semibold text-white leading-none hover:text-purple-200/90 focus:outline-none focus:ring-2 focus:ring-purple-400/40 rounded-sm py-0.5"
  >
    Simple Worflow Menager
  </a>

  <div class="flex flex-wrap items-center gap-1.5 shrink-0">
    @if (!authService.currentUser()) {
      <a
        routerLink="/login"
        class="rounded-lg bg-purple-500 text-white px-2.5 py-1 md:px-3 md:py-1.5 text-xs font-medium hover:bg-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-300 shadow-sm hover:shadow-sm transition-shadow leading-none"
      >
        Login
      </a>
      <a
        routerLink="/register"
        class="rounded-lg bg-purple-500 text-white px-2.5 py-1 md:px-3 md:py-1.5 text-xs font-medium hover:bg-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-300 shadow-sm hover:shadow-sm transition-shadow leading-none"
      >
        Register
      </a>
    } @else {
      <div class="relative flex flex-wrap items-center gap-1.5">
        <button
          type="button"
          (click)="togglePanel($event)"
          [attr.aria-expanded]="panelOpen()"
          aria-haspopup="dialog"
          aria-controls="account-panel"
          class="max-w-[min(100%,14rem)] truncate rounded-lg border border-neutral-700/80 bg-neutral-900/60 text-neutral-200 px-2.5 py-1 md:px-3 md:py-1.5 text-xs font-medium hover:border-neutral-600 hover:bg-neutral-800/80 focus:outline-none focus:ring-2 focus:ring-purple-400/40 leading-none text-left"
          [attr.title]="authService.currentUser()?.email ?? ''"
        >
          Hello,
          {{ authService.displayLabel(authService.currentUser()) }}
        </button>

        @if (panelOpen()) {
          <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
          <div
            id="account-panel"
            role="dialog"
            aria-label="Account"
            class="absolute right-0 top-full z-[200] mt-2 w-[min(calc(100vw-1.5rem),17rem)] rounded-xl border border-neutral-800 bg-neutral-950 p-4 shadow-2xl shadow-black/60 ring-1 ring-neutral-800/80"
            (click)="$event.stopPropagation()"
          >
            <p
              class="mb-3 truncate text-xs text-neutral-500"
              [title]="authService.currentUser()?.email ?? ''"
            >
              {{ authService.currentUser()?.email ?? '' }}
            </p>
            <label
              for="nickname-input"
              class="mb-1 block text-xs font-medium text-neutral-400"
              >Nickname</label
            >
            <input
              id="nickname-input"
              type="text"
              maxlength="40"
              [value]="nicknameDraft()"
              (input)="onNicknameInput($event)"
              autocomplete="nickname"
              placeholder="Shown instead of email"
              class="mb-1 w-full rounded-lg border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm text-white placeholder-neutral-500 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-purple-400/40"
            />
            <p class="mb-3 text-[0.65rem] text-neutral-500">
              Leave empty to use your email in the greeting.
            </p>
            @if (saveError()) {
              <p class="mb-2 text-xs text-red-400">{{ saveError() }}</p>
            }
            <div class="flex flex-wrap gap-2">
              <button
                type="button"
                (click)="saveNickname()"
                [disabled]="saving()"
                class="rounded-lg bg-purple-500 px-3 py-2 text-xs font-medium text-white hover:bg-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-300 disabled:cursor-not-allowed disabled:opacity-50"
              >
                {{ saving() ? 'Saving…' : 'Save' }}
              </button>
              <button
                type="button"
                (click)="closePanel()"
                class="rounded-lg border border-neutral-600 bg-neutral-900 px-3 py-2 text-xs font-medium text-neutral-200 hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-500/40"
              >
                Cancel
              </button>
            </div>
          </div>
        }

        <button
          type="button"
          (click)="logout()"
          class="rounded-lg bg-purple-500 px-2.5 py-1 text-xs font-medium text-white hover:bg-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-300 shadow-sm transition-shadow md:px-3 md:py-1.5"
        >
          Logout
        </button>
      </div>
    }
  </div>
</nav>
