<div class="flex flex-1 min-h-0 items-center justify-center bg-black p-6">
  <div class="w-full max-w-md rounded-xl bg-neutral-900 border border-neutral-800 p-8 shadow-lg">
    <h2 class="text-2xl font-semibold text-white text-center mb-6">Register</h2>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-neutral-400 mb-1">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          (input)="onEmailInput()"
          autocomplete="email"
          class="w-full rounded-lg bg-neutral-800 border px-4 py-3 text-white placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent"
          [class.border-red-500]="showEmailInvalid()"
          [class.border-neutral-700]="!showEmailInvalid()"
          placeholder="you@example.com"
        />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-neutral-400 mb-1">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="new-password"
          class="w-full rounded-lg bg-neutral-800 border border-neutral-700 px-4 py-3 text-white placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent"
          placeholder="Min. 6 characters"
        />
      </div>
      <button
        type="submit"
        [disabled]="registerDisabled()"
        class="w-full rounded-xl bg-purple-500 text-white px-5 py-3 font-medium hover:bg-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-300 shadow-sm transition-colors disabled:pointer-events-none disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-neutral-600 disabled:text-neutral-300 disabled:hover:bg-neutral-600"
      >
        @if (isLoading()) {
          <span class="inline-block w-4 h-4 border-2 border-neutral-500 border-t-white rounded-full animate-spin"></span>
        } @else {
          Register
        }
      </button>

      @if (errorMessage()) {
        <p class="text-red-400 text-sm text-center">{{ errorMessage() }}</p>
      }
      @if (successMessage()) {
        <p class="text-green-400 text-sm text-center">{{ successMessage() }}</p>
      }
    </form>

    <p class="mt-6 text-center text-sm text-neutral-500">
      Already have an account?
      <a routerLink="/login" class="text-purple-400 hover:text-purple-300 font-medium">Login</a>
    </p>
  </div>
</div>
