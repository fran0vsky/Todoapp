<div class="flex flex-1 min-h-0 items-center justify-center bg-black p-6">
  <div class="w-full max-w-md rounded-xl bg-neutral-900 border border-neutral-800 p-8 shadow-lg">
    <h2 class="text-2xl font-semibold text-white text-center mb-6">Login</h2>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-neutral-400 mb-1">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          class="w-full rounded-lg bg-neutral-800 border border-neutral-700 px-4 py-3 text-white placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent"
          placeholder="you@example.com"
        />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-neutral-400 mb-1">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          class="w-full rounded-lg bg-neutral-800 border border-neutral-700 px-4 py-3 text-white placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent"
          placeholder="Your password"
        />
      </div>
      <button
        type="submit"
        class="w-full rounded-xl bg-purple-500 text-white px-5 py-3 font-medium hover:bg-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-300 shadow-sm transition-colors"
      >
        Login
      </button>

      @if (errorMessage()) {
        <p class="text-red-400 text-sm text-center">{{ errorMessage() }}</p>
      }
    </form>

    <p class="mt-6 text-center text-sm text-neutral-500">
      Don't have an account?
      <a routerLink="/register" class="text-purple-400 hover:text-purple-300 font-medium">Register</a>
    </p>
  </div>
</div>
